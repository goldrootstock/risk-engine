# Named sample windows / universe subsets for the return builder (design note 02 §3-1).
# The ETL always loads full history; these sets are calculation-time choices and the
# chosen set name is recorded in risk_runs.params.universe.

[default]
start = 2006-02-09          # 30-year Treasury reissued; all 31 series available from here
exclude = []

[from_1999]                 # official backtest set (JK decision 2026-09-13, option a2)
start = 1999-01-04          # euro launch
exclude = ["UST_1M", "EURCNY"]   # 1M: DV01 ~ 0, starts 2001-07; CNY: managed peg, starts 2005-04
# UST_30Y stays: FRED DGS30 carries H.15 estimates for 2002-02-19..2006-02-08 (994 rows,
# extrapolated from the 20-year CMT) — disclosed in decisions.md and the model document.

[rates_energy_1990]
start = 1990-04-02          # Gulf Coast jet fuel starts; rates + energy only, no FX
include = ["UST_3M", "UST_6M", "UST_1Y", "UST_2Y", "UST_3Y", "UST_5Y", "UST_7Y", "UST_10Y",
           "WTI", "BRENT", "GASOLINE_NYH", "GASOLINE_USGC", "HEATOIL_NYH", "JET_USGC"]
