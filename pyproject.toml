[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "risk-engine"
version = "0.1.0"
description = "Portfolio Risk & CCP Margin Engine: FHS ES/VaR, regulatory backtesting, VaR-based initial margin"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Juwon Kim" }]
keywords = ["risk", "expected-shortfall", "var", "backtesting", "margin", "frtb"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.7",   # pinned: local gate and CI must run the same formatter/linter
  "mypy==2.3.1",    # pinned: bump deliberately, never by accident of a fresh install
  "pandas-stubs>=2.2",
]

[project.urls]
Repository = "https://github.com/goldrootstock/risk-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_engine"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "db: requires a running PostgreSQL reachable via DATABASE_URL",
]
filterwarnings = ["error::DeprecationWarning:risk_engine"]

[tool.coverage.run]
source = ["risk_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# fail_under = 70   # enable once the first core module (returns / FHS) lands

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade (modern 3.12 syntax)
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "D",        # pydocstyle
]
ignore = [
  "D100",  # module docstring
  "D104",  # package docstring
  "D107",  # __init__ docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
